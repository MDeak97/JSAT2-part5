<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Part 5 - Movie UI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Movie UI Application</h1>

    <!-- 1. Movie List Section -->
    <main>
      <section class="card">
        <h2>Movie List</h2>
        <div id="movieList"></div>
        <br />
        <button onclick="refreshList()">Refresh</button>
      </section>
    </main>

    <!-- 2. Tabs Section -->
    <div class="tabs">
      <button class="tablink active" onclick="openTab(event, 'AddMovie')">
        Add Movie
      </button>
      <button class="tablink" onclick="openTab(event, 'SearchMovie')">
        Search Movie
      </button>
      <button class="tablink" onclick="openTab(event, 'SortMovie')">
        Sort Movie
      </button>
    </div>

    <!-- 3. Add Movie Section -->
    <section id="AddMovie" class="tabcontent card">
      <h2>Add a Movie</h2>
      <input
        id="movieId"
        type="number"
        placeholder="Movie ID (positive number)"
      />
      <br />
      <input id="movieTitle" type="text" placeholder="Title" />
      <br />
      <input
        id="movieYear"
        type="number"
        placeholder="Year"
        class="no-spinner"
      />
      <br />
      <select id="movieRating">
        <option value="">Select Rating</option>
        <option value="1">⭐</option>
        <option value="2">⭐⭐</option>
        <option value="3">⭐⭐⭐</option>
        <option value="4">⭐⭐⭐⭐</option>
        <option value="5">⭐⭐⭐⭐⭐</option>
      </select>
      <br />
      <button onclick="addMovie()">Submit</button>
    </section>

    <!-- 4. Search Movie Section -->
    <section id="SearchMovie" class="tabcontent card" style="display: none">
      <h2>Search Movie</h2>
      <input id="searchId" type="number" placeholder="Search by ID" />
      <button onclick="searchById()">Search ID</button>
      <br /><br />
      <input id="searchTitle" type="text" placeholder="Search by Title" />
      <button onclick="searchByTitle()">Search Title</button>
      <br /><br />
      <div id="searchResult"></div>
    </section>

    <!-- 5. Sort Movie Section -->
    <section id="SortMovie" class="tabcontent card" style="display: none">
      <h2>Sorting</h2>
      <button onclick="sortAZ()">Sort A-Z</button>
      <button onclick="sortZA()">Sort Z-A</button>
      <button onclick="sortBest()">Best Movies</button>
    </section>
    <script src="script.js"></script>
  </body>
</html>
